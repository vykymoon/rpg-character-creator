# Integracion continua (Corte 3, seccion 2).
#
# Corre en cada push a una rama y en cada pull request. En main la llama
# cd.yml como primera etapa, asi un despliegue nunca ocurre sin que pasen
# antes todas las verificaciones. Cada job es un check del pull request y
# los checks son obligatorios en el ruleset de main.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp

jobs:
  build:
    name: Construccion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar codigo y pruebas
        run: mvn $MAVEN_ARGS test-compile

  unit:
    name: Pruebas unitarias y cobertura
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # jacoco:check corre en la fase test y rompe la construccion si la
      # cobertura de lineas de domain + application baja del umbral del pom.
      - name: Pruebas unitarias con umbral de cobertura del dominio
        run: mvn $MAVEN_ARGS test -Dtest='!ArchitectureTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Resumen de cobertura
        if: always()
        run: python3 .github/scripts/coverage_summary.py target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas-unitarias
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn

  architecture:
    name: Reglas de arquitectura
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: ArchUnit (fitness functions de los ADR)
        run: mvn $MAVEN_ARGS test -Dtest=ArchitectureTest -Djacoco.skip=true
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-arquitectura
          path: target/surefire-reports/
          if-no-files-found: warn

  integration:
    name: Pruebas de integracion
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Solo Failsafe (*IT): las unitarias ya corrieron en su propio job.
      - name: Servidor real y clientes WebSocket reales
        run: mvn $MAVEN_ARGS verify -Djacoco.skip=true -Dtest=NingunaUnitaria -Dsurefire.failIfNoSpecifiedTests=false
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas-integracion
          path: target/failsafe-reports/
          if-no-files-found: warn

  sast:
    name: Seguridad - SAST (CodeQL)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-java
          output: sarif-results
      # CodeQL solo reporta en la pestana Security. Este paso aplica el umbral
      # del ADR-005: ningun hallazgo con severidad de seguridad >= 7.0 (alta o
      # critica) que no este tratado en docs/seguridad.md.
      - name: Umbral SAST (alto o critico detiene el pipeline)
        run: python3 .github/scripts/sarif_gate.py sarif-results --min-severity 7.0 --allowlist .github/security/sast-allowlist.txt
      - name: Publicar SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-sast
          path: sarif-results/

  sca:
    name: Seguridad - dependencias (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Trivy necesita el arbol de dependencias resuelto para ver las transitivas.
      - name: Resolver dependencias
        run: mvn $MAVEN_ARGS dependency:go-offline -q
      - name: Trivy fs (ninguna alta o critica con correccion)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table
          output: trivy-sca.txt
      - name: Mostrar resultado
        if: always()
        run: cat trivy-sca.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-sca
          path: trivy-sca.txt

  dependency-review:
    name: Seguridad - revision de dependencias del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  secrets:
    name: Seguridad - deteccion de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # todo el historial, no solo el ultimo commit
      - name: Instalar Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks sobre todo el historial de Git (cero secretos)
        run: |
          gitleaks git . --config .gitleaks.toml --redact --verbose \
            --report-format sarif --report-path gitleaks.sarif --exit-code 1
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-secretos
          path: gitleaks.sarif
          if-no-files-found: ignore

  image:
    name: Imagen Docker y escaneo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construir la imagen (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rpg-servidor:ci-${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image (ninguna critica o alta con correccion)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rpg-servidor:ci-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table
          output: trivy-image.txt
      - name: El contenedor arranca y su healthcheck responde
        run: |
          docker run -d --name rpg -p 8887:8887 -e JOIN_CODE=ci rpg-servidor:ci-${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8887/health; then exit 0; fi
            sleep 2
          done
          docker logs rpg
          exit 1
      - name: El proceso no corre como root
        run: test "$(docker exec rpg id -u)" != "0"
      - name: Mostrar resultado del escaneo
        if: always()
        run: cat trivy-image.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-imagen
          path: trivy-image.txt
