# Reversion a una version anterior (Corte 3, seccion 5).
#
# Vuelve a desplegar en Render una imagen que ya esta en GHCR, sin
# reconstruir nada: la imagen de un tag (p. ej. 1.0.0) o de un commit
# (p. ej. sha-<sha-completo>). Despues corre la misma prueba de humo del
# despliegue normal. Procedimiento completo en docs/devops.md.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Etiqueta de la imagen a restaurar (ej.: 1.0.0 o sha-<sha completo>)'
        required: true
        type: string
      reason:
        description: 'Motivo de la reversion (queda en el registro de la ejecucion)'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rpg-servidor

jobs:
  rollback:
    name: Reversion a ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Comprobar que la imagen existe en GHCR
        id: image
        run: |
          IMAGE="${IMAGE_NAME}:${{ inputs.version }}"
          docker manifest inspect "$IMAGE" > /dev/null
          # La version que reportara /health es el SHA horneado en la imagen.
          docker pull -q "$IMAGE"
          VERSION="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE" | sed -n 's/^APP_VERSION=//p')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### Reversion"
            echo "- Imagen: \`$IMAGE\`"
            echo "- Commit: \`$VERSION\`"
            echo "- Motivo: ${{ inputs.reason }}"
            echo "- Lanzada por: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Desplegar la imagen anterior
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: bash scripts/render-deploy.sh "${{ steps.image.outputs.image }}"
      - name: Esperar a que responda la version restaurada
        run: bash scripts/wait-for-health.sh "${{ vars.APP_URL }}" "${{ steps.image.outputs.version }}" 600
      - uses: grafana/setup-k6-action@v1
      - name: Prueba de humo sobre la version restaurada
        env:
          APP_URL: ${{ vars.APP_URL }}
          JOIN_CODE: ${{ secrets.JOIN_CODE }}
        run: |
          WS_URL="$(echo "$APP_URL" | sed -e 's#^https://#wss://#' -e 's#^http://#ws://#')/ws"
          k6 run --env HTTP_URL="$APP_URL" --env WS_URL="$WS_URL" --env JOIN_CODE="$JOIN_CODE" \
                 --env EXPECTED_VERSION="${{ steps.image.outputs.version }}" perf/scripts/smoke_k6.js
