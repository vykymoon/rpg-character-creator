# Prometheus para el entorno local (docker compose --profile observabilidad).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: rpg-servidor
    metrics_path: /metrics
    static_configs:
      - targets: ["servidor:8887"]
        labels:
          entorno: local
