apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpg-servidor
  namespace: rpg
  labels:
    app.kubernetes.io/name: rpg-servidor
spec:
  # Una sola replica a proposito: el estado de la partida vive en memoria del
  # servidor autoritativo (ADR-001). Dos replicas serian dos partidas
  # distintas. Escalar exige mover el estado a un almacen compartido (limite
  # conocido, docs/evolucion.md).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rpg-servidor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpg-servidor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8887"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: rpg-servidor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: servidor
          image: rpg-servidor:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8887
          envFrom:
            - configMapRef:
                name: rpg-servidor-config
            - secretRef:
                name: rpg-servidor-secret
          env:
            - name: APP_VERSION
              value: k8s
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
