# Secreto de ejemplo para kind/minikube. NO es un valor real.
# En un cluster de verdad se crea fuera del repositorio:
#   kubectl -n rpg create secret generic rpg-servidor-secret \
#     --from-literal=JOIN_CODE="$(openssl rand -hex 12)"
# El workflow k8s.yml lo reemplaza por un valor aleatorio en cada ejecucion.
apiVersion: v1
kind: Secret
metadata:
  name: rpg-servidor-secret
  namespace: rpg
type: Opaque
stringData:
  JOIN_CODE: "cambie-este-codigo"
